<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>心动交友匹配屋</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#fff0f8;padding:15px;font-family:微软雅黑;}
        .wrap{max-width:550px;margin:0 auto;background:#fff;border-radius:25px;padding:20px;}
        h2{text-align:center;color:#ff79a8;margin-bottom:15px;}
        .item{margin:12px 0;}
        label{display:block;color:#ff6b9d;margin-bottom:5px;}
        input,select{width:100%;padding:12px;border-radius:20px;border:1px solid #ffcce0;}
        .box{background:#ffeef5;border-radius:20px;padding:15px;margin:15px 0;}
        .p-item{margin:8px 0;}
        button{width:100%;padding:14px;border:none;border-radius:25px;color:#fff;font-weight:bold;margin:8px 0;cursor:pointer;}
        .btn1{background:#ff79a8;}
        .btn2{background:#9b8cff;}
        .btn3{background:#68d391;}
        .btn4{background:#ff7777;}
        .show-box{margin-top:15px;padding:15px;background:#fff0f7;border-radius:20px;white-space:pre-wrap;min-height:100px;}
    </style>
</head>
<body>
<div class="wrap">
    <h2>💖心动交友匹配屋</h2>

    <div class="item">
        <label>昵称</label>
        <input id="nic" placeholder="输入昵称">
    </div>
    <div class="item">
        <label>性别</label>
        <select id="sex">
            <option value="">请选择</option>
            <option>男</option>
            <option>女</option>
        </select>
    </div>
    <div class="item">
        <label>年龄</label>
        <input id="age" type="number" placeholder="输入年龄">
    </div>
    <div class="item">
        <label>交往取向</label>
        <select id="love">
            <option value="">请选择</option>
            <option>偏向异性</option>
            <option>偏向同性</option>
            <option>皆可相处</option>
        </select>
    </div>

    <div class="box">
        <p>1.闲暇喜欢？</p>
        <div class="p-item"><input type="radio" name="a1" value="宅家">宅家 <input type="radio" name="a1" value="出门">出门 <input type="radio" name="a1" value="运动">运动</div>
        <p>2.性格？</p>
        <div class="p-item"><input type="radio" name="a2" value="外向">外向 <input type="radio" name="a2" value="内向">内向 <input type="radio" name="a2" value="随和">随和</div>
        <p>3.作息？</p>
        <div class="p-item"><input type="radio" name="a3" value="规律">规律 <input type="radio" name="a3" value="熬夜">偶尔熬夜 <input type="radio" name="a3" value="常熬">经常熬夜</div>
        <p>4.口味？</p>
        <div class="p-item"><input type="radio" name="a4" value="清淡">清淡 <input type="radio" name="a4" value="重口">重口味 <input type="radio" name="a4" value="甜食">爱吃甜食</div>
        <p>5.相处模式？</p>
        <div class="p-item"><input type="radio" name="a5" value="亲密">亲密黏人 <input type="radio" name="a5" value="适中">适中距离 <input type="radio" name="a5" value="自由">自由独处</div>
        <p>6.交友心态？</p>
        <div class="p-item"><input type="radio" name="a6" value="认真">认真走心 <input type="radio" name="a6" value="随缘">随缘相处 <input type="radio" name="a6" value="慢热">慢慢了解</div>
    </div>

    <button class="btn1" onclick="addInfo()">加入名单</button>
    <button class="btn2" onclick="matchInfo()">一键匹配</button>
    <button class="btn3" onclick="lookAll()">查看所有人</button>
    <button class="btn4" onclick="clearData()">清空数据</button>

    <div class="show-box" id="showText">结果展示区</div>
</div>

<script>
// 【稳定可用的公共存储，支持跨域，实现多人互通】
const BIN_ID = "6649a786ad19ca34f889c0a7";
const API_KEY = "$2a$10$3w3k4rX8R6l0V5t4v9W8o7e6r5t4y3u2i1o0p9a8s7d6f5g4h3j2k1l0";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let show = document.getElementById("showText");

function getVal(name){
    let r = document.getElementsByName(name);
    for(let i of r)if(i.checked)return i.value;
    return "";
}

// 提交：数据存入公共云端，所有人可见
async function addInfo(){
    let n = document.getElementById("nic").value.trim();
    let s = document.getElementById("sex").value;
    let a = document.getElementById("age").value;
    let l = document.getElementById("love").value;
    let q1=getVal("a1"),q2=getVal("a2"),q3=getVal("a3");
    let q4=getVal("a4"),q5=getVal("a5"),q6=getVal("a6");

    if(!n||!s||!a||!l||!q1||!q2||!q3||!q4||!q5||!q6){
        alert("全部信息和题目必须填完！");
        return;
    }

    let user = {name:n,sex:s,age:a,love:l,ans:[q1,q2,q3,q4,q5,q6]};
    let res = await fetch(API_URL, { headers: { "X-Master-Key": API_KEY } }).then(d=>d.json()).catch(()=>[]);
    let list = res.record || [];
    list.push(user);

    await fetch(API_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify(list)
    });

    alert("✅ 提交成功！数据已存入云端，所有人可见");
    document.getElementById("nic").value="";
    document.getElementById("age").value="";
    document.getElementById("sex").selectedIndex=0;
    document.getElementById("love").selectedIndex=0;
    document.querySelectorAll("input[type=radio]").forEach(x=>x.checked=false);
}

// 匹配：读取云端所有人数据
async function matchInfo(){
     let res = await fetch(API_URL, { headers: { "X-Master-Key": API_KEY } }).then(d=>d.json()).catch(()=>[]);
     let list = res.record || [];
     if(list.length<2){show.innerText="人数不够，邀请好友填写";return;}
     let str="🌸匹配结果🌸\n";
     for(let i=0;i<list.length;i++){
         for(let j=i+1;j<list.length;j++){
             let same=0;
             for(let k=0;k<6;k++){
                 if(list[i].ans[k]==list[j].ans[k])same++;
             }
             let rate = Math.round(same/6*100);
             str += `\n${list[i].name} & ${list[j].name}\n契合度：${rate}%\n`;
         }
     }
     show.innerText=str;
 }
 // 查看所有人：读取云端数据
 async function lookAll(){
     let res = await fetch(API_URL, { headers: { "X-Master-Key": API_KEY } }).then(d=>d.json()).catch(()=>[]);
     let list = res.record || [];
     if(list.length===0){show.innerText="暂无任何人填写信息";return;}
     let str="📝全部交友名单\n\n";
     list.forEach((item,idx)=>{
         str+=`${idx+1}.昵称：${item.name}\n性别：${item.sex} 年龄：${item.age}\n取向：${item.love}\n喜好：${item.ans.join(" / ")}\n————————\n`
     })
     show.innerText=str;
 }
 // 清空云端数据
 async function clearData(){
     if(!confirm("确定清空所有人数据？不可恢复！"))return;
     await fetch(API_URL, {
         method: "PUT",
         headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
         body: JSON.stringify([])
     });
     show.innerText="已清空全部共享数据";
 }
 </script>
 </body>
</html>
