<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心动交友匹配屋</title>
<style>
  body{background:#fff0f8;padding:20px;font-family:Arial;}
  .box{max-width:400px;margin:0 auto;background:white;padding:20px;border-radius:20px;}
  input,select,button{width:100%;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #ffcce0;}
  button{background:#ff79a8;color:white;font-weight:bold;border:none;}
  .res{margin-top:20px;padding:15px;background:#ffeef5;border-radius:10px;white-space:pre-wrap;}
  .quiz{margin:10px 0;}
</style>
</head>
<body>
<div class="box">
  <h2>💖心动交友匹配屋</h2>

  <input id="name" placeholder="昵称">
  <select id="gender">
    <option value="">性别</option>
    <option>男</option>
    <option>女</option>
  </select>
  <input id="age" placeholder="年龄" type="number">
  <select id="loveType">
    <option value="">交往取向</option>
    <option>异</option>
    <option>同</option>
    <option>双</option>
  </select>

  <div class="quiz">
    <p>1.闲暇日常更喜欢？</p>
    <label><input type="radio" name="q1" value="居家休闲">居家休闲</label>
    <label><input type="radio" name="q1" value="外出游玩">外出游玩</label>
    <label><input type="radio" name="q1" value="运动健身">运动健身</label>
  </div>
  <div class="quiz">
    <p>2.自身性格属于？</p>
    <label><input type="radio" name="q2" value="外向开朗">外向开朗</label>
    <label><input type="radio" name="q2" value="慢热内敛">慢热内敛</label>
    <label><input type="radio" name="q2" value="佛系随和">佛系随和</label>
  </div>
  <div class="quiz">
    <p>3.平时作息状态？</p>
    <label><input type="radio" name="q3" value="作息规律">作息规律</label>
    <label><input type="radio" name="q3" value="偶尔熬夜">偶尔熬夜</label>
    <label><input type="radio" name="q3" value="习惯晚睡">习惯晚睡</label>
  </div>
  <div class="quiz">
    <p>4.饮食口味偏好？</p>
    <label><input type="radio" name="q4" value="清淡口味">清淡口味</label>
    <label><input type="radio" name="q4" value="重辣口味">重辣口味</label>
    <label><input type="radio" name="q4" value="偏爱甜食">偏爱甜食</label>
  </div>
  <div class="quiz">
    <p>5.喜欢的相处模式？</p>
    <label><input type="radio" name="q5" value="亲密相伴">亲密相伴</label>
    <label><input type="radio" name="q5" value="适度陪伴">适度陪伴</label>
    <label><input type="radio" name="q5" value="自由相处">自由相处</label>
  </div>
  <div class="quiz">
    <p>6.交友相处心态？</p>
    <label><input type="radio" name="q6" value="真诚认真">真诚认真</label>
    <label><input type="radio" name="q6" value="顺其自然">顺其自然</label>
    <label><input type="radio" name="q6" value="慢慢了解">慢慢了解</label>
  </div>

  <button onclick="add()">加入匹配名单</button>
  <button onclick="match()">一键智能配对</button>
  <button onclick="show()">查看全部数据</button>
  <button onclick="clear()">清空数据</button>

  <div class="res" id="result"></div>
</div>

<script>
// 纯本地运行，不联网！按钮100%能点！带6道题+精准匹配！
let list = JSON.parse(localStorage.getItem('loveList') || '[]');

function getAns(name) {
  let list = document.getElementsByName(name);
  for (let r of list) if (r.checked) return r.value;
  return '';
}

function add() {
  let name = document.getElementById('name').value;
  let gender = document.getElementById('gender').value;
  let age = document.getElementById('age').value;
  let loveType = document.getElementById('loveType').value;

  let a1 = getAns('q1');
  let a2 = getAns('q2');
  let a3 = getAns('q3');
  let a4 = getAns('q4');
  let a5 = getAns('q5');
  let a6 = getAns('q6');

  if (!name || !gender || !age || !loveType || !a1 || !a2 || !a3 || !a4 || !a5 || !a6) {
    alert('请填完所有信息和题目！');
    return;
  }

  list.push({
    name, gender, age, loveType,
    ans: [a1,a2,a3,a4,a5,a6]
  });

  localStorage.setItem('loveList', JSON.stringify(list));
  alert('添加成功！');
  
  // 清空
  document.getElementById('name').value = '';
  document.getElementById('age').value = '';
  document.getElementById('gender').selectedIndex = 0;
  document.getElementById('loveType').selectedIndex = 0;
  document.querySelectorAll('input[type=radio]').forEach(i => i.checked = false);
}

function show() {
  if (list.length === 0) {
    document.getElementById('result').innerText = '暂无数据';
    return;
  }
  let s = '';
  list.forEach((i, n) => {
    s += `${n+1}. ${i.name} ${i.gender} ${i.age}岁 ${i.loveType}\n答案：${i.ans.join(' | ')}\n\n`;
  });
  document.getElementById('result').innerText = s;
}

function match() {
  if (list.length < 2) {
    document.getElementById('result').innerText = '至少需要2人才能匹配';
    return;
  }

  let res = '🌸 匹配结果（答案相同越多越配）🌸\n\n';
  let pairs = [];

  for (let i=0; i<list.length; i++) {
    for (let j=i+1; j<list.length; j++) {
      let u1 = list[i];
      let u2 = list[j];
      let same = 0;
      for (let t=0; t<6; t++) {
        if (u1.ans[t] === u2.ans[t]) same++;
      }
      let rate = Math.round(same/6*100);
      pairs.push({ u1, u2, same, rate });
    }
  }

  pairs.sort((a,b) => b.rate - a.rate);

  pairs.forEach((p, i) => {
    res += `${i+1}. ${p.u1.name} ↔ ${p.u2.name}\n相同${p.same}题 | 匹配率${p.rate}%\n\n`;
  });

  document.getElementById('result').innerText = res;
}
function clear() {
    if (confirm('确定清空所有数据？')) {
        list = [];
        localStorage.setItem('loveList', JSON.stringify(list));
        document.getElementById('result').innerText = '已清空';
    }
}
